<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Agency Elite</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Arabic DIN NEXT -->
    <link href="https://fonts.googleapis.com/css2?family=DIN+Next+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- English Font: Public Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#cb252d",
              "primary-dark": "#a81f25",
              "background-dark": "#201213",
              "background-light": "#fafafa",
              "card-dark": "#2d1a1c",
              "card-light": "#ffffff",
              "secondary-gray": "#58595B",
              "text-secondary": "#c49799",
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"],
              "bodyEn": ["Public Sans", "sans-serif"],
              "bodyAr": ["DIN Next Arabic", "Public Sans", "sans-serif"],
            }
          }
        }
      }
    </script>

    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #201213;
      }
      .light ::-webkit-scrollbar-track {
        background: #f5f5f5;
      }
      ::-webkit-scrollbar-thumb {
        background: #58595B;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cb252d;
      }

      /* Glass effect */
      .glass-effect {
        background: rgba(88, 89, 91, 0.25);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* RTL Arabic font */
      [dir="rtl"] {
        font-family: "DIN Next Arabic", "Public Sans", sans-serif;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
      }
    }
    </script>

    <link rel="stylesheet" href="/index.css">
  </head>

  <body class="bg-[#201213] dark:bg-[#201213] light:bg-[#fafafa] text-white dark:text-white light:text-gray-900 font-bodyEn selection:bg-primary selection:text-white dark:selection:text-white light:selection:text-white antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>

    <script>
      // تغيير الخط حسب اللغة
      const language = localStorage.getItem('language') || 'en';
      document.documentElement.setAttribute('lang', language);
      document.documentElement.setAttribute('dir', language === 'ar' ? 'rtl' : 'ltr');

      if(language === 'ar') {
        document.body.classList.remove('font-bodyEn');
        document.body.classList.add('font-bodyAr');
      } else {
        document.body.classList.remove('font-bodyAr');
        document.body.classList.add('font-bodyEn');
      }
    </script>

     
  </body>
</html>
